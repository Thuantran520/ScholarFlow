<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ScholarFlow — Pomodoro</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/popup.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --pw-bg0: #0b1220;
      --pw-bg1: #0f1e35;
      --pw-ink: #f8fafc;
      --pw-muted: #94a3b8;
    }
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      color: var(--pw-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, var(--pw-bg0) 0%, var(--pw-bg1) 55%, #1a1033 100%);
      display: flex;
      flex-direction: column;
      position: relative;
    }
    .pw-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
    }
    .pw-blob-1 {
      width: 170px; height: 170px;
      top: -48px; left: -42px;
      background: rgba(249, 115, 22, 0.5);
    }
    .pw-blob-2 {
      width: 190px; height: 190px;
      bottom: -64px; right: -56px;
      background: rgba(139, 92, 246, 0.45);
    }
    .pw-blob-3 {
      width: 90px; height: 90px;
      right: 30px; top: 26px;
      background: rgba(56, 189, 248, 0.4);
    }
    .pw-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 10px 4px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #cbd5e1;
      z-index: 1;
    }
    .pw-brand::before,
    .pw-brand::after {
      content: "";
      height: 1px;
      width: 34px;
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.6));
    }
    .pw-brand::after {
      background: linear-gradient(90deg, rgba(148, 163, 184, 0.6), transparent);
    }
    .pw-card {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 6px 16px 16px;
      position: relative;
      z-index: 1;
    }
    .pw-ring-wrap { position: relative; width: 190px; height: 190px; }
    #pw-ring { width: 190px; height: 190px; display: block; }
    #pw-ring-fg {
      transition: stroke-dashoffset 0.5s linear, stroke 0.4s ease;
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.55));
    }
    .pw-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-align: center;
    }
    #pw-time {
      font-size: 48px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      line-height: 1;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }
    #pw-mode {
      font-size: 12px;
      font-weight: 800;
      padding: 3px 12px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    }
    #pw-status {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--pw-muted);
      padding: 4px 14px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .pw-controls { display: flex; gap: 12px; }
    .pw-sizectl {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .pw-size-btn {
      min-width: 30px;
      height: 26px;
      padding: 0 8px;
      border: none;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      cursor: pointer;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: background 0.15s ease;
    }
    .pw-size-btn:hover { background: rgba(255, 255, 255, 0.18); color: #ffffff; }
    .pw-size-btn:active { background: rgba(255, 255, 255, 0.26); }
    .pw-size-btn.on {
      color: #0f172a;
      background: linear-gradient(135deg, #fb923c, #f97316);
      border-color: #fb923c;
      box-shadow: 0 3px 12px rgba(249, 115, 22, 0.4);
    }
    .pw-vsep { width: 1px; height: 18px; background: rgba(255, 255, 255, 0.14); }
    #pw-mini-toggle { font-size: 13px; line-height: 1; }
    .pw-btn {
      min-width: 54px;
      padding: 10px 14px;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: background 0.18s ease, transform 0.12s ease;
    }
    .pw-btn:hover { background: rgba(255, 255, 255, 0.18); color: #ffffff; transform: translateY(-1px); }
    .pw-btn:active { transform: translateY(0); }
    .pw-primary {
      color: #fed7aa;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.4), rgba(234, 88, 12, 0.25));
      border: 1px solid rgba(249, 115, 22, 0.55);
      box-shadow: 0 6px 22px rgba(249, 115, 22, 0.28);
    }
    .pw-primary:hover { background: linear-gradient(135deg, rgba(249, 115, 22, 0.55), rgba(234, 88, 12, 0.35)); }
    .pw-foot { text-align: center; font-size: 9.5px; color: #64748b; padding: 0 0 10px; z-index: 1; }
    body.pw-running #pw-ring-fg {
      animation: pwBreath 2.2s ease-in-out infinite;
    }
    body.pw-running #pw-status {
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(74, 222, 128, 0.1);
    }
    body.pw-mini .pw-brand { padding-top: 16px; }
    body.pw-mini .pw-ring-wrap,
    body.pw-mini .pw-controls,
    body.pw-mini #pw-status { display: none; }
    body.pw-mini #pw-time { font-size: 72px; }
    body.pw-mini #pw-mode { font-size: 13px; margin-top: 6px; }
    body.pw-mini .pw-card { justify-content: center; gap: 10px; }
    @keyframes pwBreath {
      0%, 100% { filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.45)); }
      50% { filter: drop-shadow(0 0 16px rgba(249, 115, 22, 0.85)); }
    }
  </style>
</head>
<body>
  <div class="pw-blob pw-blob-1"></div>
  <div class="pw-blob pw-blob-2"></div>
  <div class="pw-blob pw-blob-3"></div>
  <div class="pw-brand">ScholarFlow · Pomodoro</div>
  <div class="pw-card">
    <div class="pw-ring-wrap">
      <svg id="pw-ring" viewBox="0 0 190 190">
        <circle cx="95" cy="95" r="81" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="10"/>
        <circle id="pw-ring-fg" cx="95" cy="95" r="81" fill="none" stroke="#f97316" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="508.94" stroke-dashoffset="0" transform="rotate(-90 95 95)"/>
      </svg>
      <div class="pw-center">
        <div id="pw-time">25:00</div>
        <div id="pw-mode"></div>
      </div>
    </div>
    <div id="pw-status"></div>
    <div class="pw-controls">
      <button id="pw-toggle" class="pw-btn pw-primary" type="button">▶</button>
      <button id="pw-reset" class="pw-btn" type="button">↺</button>
    </div>
    <div class="pw-sizectl">
      <button class="pw-size-btn" data-size="s" title="Small">S</button>
      <button class="pw-size-btn" data-size="m" title="Medium">M</button>
      <button class="pw-size-btn" data-size="l" title="Large">L</button>
      <span class="pw-vsep"></span>
      <button id="pw-mini-toggle" class="pw-size-btn" type="button" title="Thu nhỏ">▁</button>
    </div>
  </div>
  <script src="../locales/vi.js"></script>
  <script src="../locales/en.js"></script>
  <script src="../locales/zh.js"></script>
  <script src="../locales/ru.js"></script>
  <script src="../locales/ja.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/core/browser.js"></script>
  <script src="../js/core/constants.js"></script>
  <script src="../js/tabs/pomo-window.js"></script>
</body>
</html>
