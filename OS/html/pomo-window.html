<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Panadolce — Pomodoro</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/popup.css">
  <style>
    * { box-sizing: border-box; }
    :root {
      --pw-bg0: #0b1220;
      --pw-bg1: #0f1e35;
      --pw-ink: #f8fafc;
      --pw-muted: #94a3b8;
    }
    html, body { width: 100%; height: 100%; }
    body {
      margin: 0;
      overflow: hidden;
      color: var(--pw-ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      background: linear-gradient(160deg, var(--pw-bg0) 0%, var(--pw-bg1) 55%, #1a1033 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      container-type: size;
    }
    .pw-blob {
      position: absolute;
      border-radius: 50%;
      filter: blur(60px);
      opacity: 0.55;
      pointer-events: none;
    }
    .pw-blob-1 { width: clamp(90px, 34vh, 170px); height: clamp(90px, 34vh, 170px); top: -48px; left: -42px; background: rgba(249, 115, 22, 0.5); }
    .pw-blob-2 { width: clamp(100px, 40vh, 190px); height: clamp(100px, 40vh, 190px); bottom: -64px; right: -56px; background: rgba(139, 92, 246, 0.45); }
    .pw-blob-3 { width: clamp(50px, 18vh, 90px); height: clamp(50px, 18vh, 90px); right: 30px; top: 26px; background: rgba(56, 189, 248, 0.4); }
    .pw-brand {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(4px, 1.2vw, 6px);
      padding: clamp(4px, 1vh, 12px) 8px 0;
      font-size: clamp(8px, 2vh, 10px);
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      color: #cbd5e1;
      z-index: 1;
    }
    .pw-brand::before, .pw-brand::after {
      content: "";
      height: 1px;
      flex: 0 0 auto;
      width: clamp(14px, 9vh, 34px);
      background: linear-gradient(90deg, transparent, rgba(148, 163, 184, 0.6));
    }
    .pw-brand::after { background: linear-gradient(90deg, rgba(148, 163, 184, 0.6), transparent); }
    .pw-card {
      flex: 1 1 auto;
      min-height: 0;
      min-width: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 1.2vh, 14px);
      padding: clamp(2px, 1vh, 10px) clamp(4px, 1.5vw, 14px);
      position: relative;
      z-index: 1;
    }
    .pw-ring-wrap {
      position: relative;
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* sizes measured against the window box itself, so any drag-resize fits */
    #pw-ring { width: min(68cqw, 46cqh, 280px); height: auto; display: block; }
    #pw-ring-fg {
      transition: stroke-dashoffset 0.5s linear, stroke 0.4s ease;
      filter: drop-shadow(0 0 8px rgba(249, 115, 22, 0.55));
    }
    .pw-center {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: clamp(2px, 0.8vh, 5px);
      text-align: center;
      min-width: 0;
    }
    #pw-time {
      font-size: clamp(16px, min(17cqw, 22cqh), 56px);
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      line-height: 1;
      white-space: nowrap;
      text-shadow: 0 2px 18px rgba(0, 0, 0, 0.55);
    }
    #pw-mode {
      font-size: clamp(8px, 2cqh, 12px);
      font-weight: 800;
      padding: clamp(1px, 0.5cqh, 3px) clamp(4px, 1.2cqw, 12px);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.55);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
      white-space: nowrap;
    }
    #pw-status {
      flex: 0 0 auto;
      font-size: clamp(8px, 1.8cqh, 11px);
      font-weight: 700;
      letter-spacing: 0.06em;
      color: var(--pw-muted);
      padding: clamp(1px, 0.5cqh, 4px) clamp(6px, 1.5cqw, 14px);
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.08);
      white-space: nowrap;
    }
    .pw-controls {
      flex: 0 0 auto;
      display: flex;
      gap: clamp(6px, 1.5vw, 12px);
    }
    .pw-btn {
      flex: 0 0 auto;
      min-width: clamp(44px, 12cqw, 62px);
      padding: clamp(5px, 1.2cqh, 10px) clamp(9px, 2cqw, 14px);
      border: none;
      border-radius: 12px;
      font-size: clamp(12px, 3cqh, 15px);
      font-weight: 800;
      cursor: pointer;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: background 0.18s ease, transform 0.12s ease;
    }
    .pw-btn:hover { background: rgba(255, 255, 255, 0.18); color: #ffffff; transform: translateY(-1px); }
    .pw-btn:active { transform: translateY(0); }
    .pw-primary {
      color: #fed7aa;
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.4), rgba(234, 88, 12, 0.25));
      border: 1px solid rgba(249, 115, 22, 0.55);
      box-shadow: 0 6px 22px rgba(249, 115, 22, 0.28);
    }
    .pw-primary:hover { background: linear-gradient(135deg, rgba(249, 115, 22, 0.55), rgba(234, 88, 12, 0.35)); }

    /* --- Small-window tuning (measured against the window box) ---------- */
    @container (max-height: 300px) {
      #pw-status { display: none; }
      .pw-brand { padding-top: 2px; }
      .pw-card { gap: 4px; padding: 2px 6px; }
      .pw-controls { gap: 8px; }
    }
    @container (max-height: 236px) {
      .pw-brand { display: none; }
    }
    @container (max-width: 190px) {
      .pw-controls { gap: 5px; }
    }

    body.pw-running #pw-ring-fg {
      animation: pwBreath 2.2s ease-in-out infinite;
    }
    body.pw-running #pw-status {
      color: #86efac;
      border-color: rgba(74, 222, 128, 0.35);
      background: rgba(74, 222, 128, 0.1);
    }
    @keyframes pwBreath {
      0%, 100% { filter: drop-shadow(0 0 7px rgba(249, 115, 22, 0.45)); }
      50% { filter: drop-shadow(0 0 16px rgba(249, 115, 22, 0.85)); }
    }
  </style>
</head>
<body>
  <div class="pw-blob pw-blob-1"></div>
  <div class="pw-blob pw-blob-2"></div>
  <div class="pw-blob pw-blob-3"></div>
  <div class="pw-brand">Panadolce · Pomodoro</div>
  <div class="pw-card">
    <div class="pw-ring-wrap">
      <svg id="pw-ring" viewBox="0 0 190 190">
        <circle cx="95" cy="95" r="81" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="10"/>
        <circle id="pw-ring-fg" cx="95" cy="95" r="81" fill="none" stroke="#f97316" stroke-width="10"
                stroke-linecap="round" stroke-dasharray="508.94" stroke-dashoffset="0" transform="rotate(-90 95 95)"/>
      </svg>
      <div class="pw-center">
        <div id="pw-time">25:00</div>
        <div id="pw-mode"></div>
      </div>
    </div>
    <div id="pw-status"></div>
    <div class="pw-controls">
      <button id="pw-toggle" class="pw-btn pw-primary" type="button">▶</button>
      <button id="pw-reset" class="pw-btn" type="button">↺</button>
    </div>
  </div>
  <script src="../locales/vi.js"></script>
  <script src="../locales/en.js"></script>
  <script src="../locales/zh.js"></script>
  <script src="../locales/ru.js"></script>
  <script src="../locales/ja.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/core/browser.js"></script>
  <script src="../js/core/constants.js"></script>
  <script src="../js/tabs/pomo-window.js"></script>
</body>
</html>
