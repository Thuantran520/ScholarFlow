<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <div class="feature-title" style="margin-bottom:0;" data-i18n="th_title">Test Helper PRO</div>
      <span id="th-step-count" style="font-size:11px; font-weight:700; color:#cbd5e1; background:rgba(255,255,255,0.08); padding:2px 8px; border-radius:12px; border:1px solid rgba(255,255,255,0.15);">0</span>
    </div>
    <p style="color:var(--text-muted); font-size:11.5px; margin-bottom:8px; line-height:1.4;" data-i18n="th_desc">Record/replay, crawl, console, visual diff, link check, fuzz, a11y, perf — gom ảnh vào ZIP.</p>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
      <button id="btn-th-record" class="btn-text-small" data-i18n="th_btn_start_rec">Ghi</button>
      <button id="btn-th-replay" class="btn-text-small" data-i18n="th_btn_replay">Phát lại</button>
      <button id="btn-th-shot" class="btn-text-small" data-i18n="th_btn_shot">Chụp</button>
      <button id="btn-th-zip" class="btn-text-small" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); color:#f1f5f9; font-weight:600;" data-i18n="th_btn_zip">Tải ZIP</button>
      <span style="margin-left:auto; font-size:10px; color:var(--text-muted);"><span id="th-shot-count">0</span> shots</span>
    </div>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
      <button id="btn-th-crawl" class="btn-text-small" data-i18n="th_btn_crawl">Crawl</button>
      <button id="btn-th-links" class="btn-text-small" data-i18n="th_btn_links">Link check</button>
      <button id="btn-th-fuzz" class="btn-text-small" data-i18n="th_btn_fuzz">Fuzz</button>
      <button id="btn-th-a11y" class="btn-text-small" data-i18n="th_btn_a11y">A11y</button>
      <button id="btn-th-perf" class="btn-text-small" data-i18n="th_btn_perf">Perf</button>
      <button id="btn-th-bug" class="btn-text-small" style="background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.18); color:#f1f5f9; font-weight:600;" data-i18n="th_btn_bug">Bug Report</button>
    </div>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <button id="btn-th-refresh-log" class="cal-tool-btn" data-i18n="th_btn_refresh_log">Làm mới log</button>
      <button id="btn-th-clear" class="cal-tool-btn" data-i18n="th_btn_clear">Xóa</button>
    </div>
    <div id="th-shots" style="display:flex; flex-direction:column; gap:6px; margin-bottom:8px; max-height:160px; overflow-y:auto;"></div>
    <div id="th-log" style="background:rgba(15,23,42,0.5); border:1px solid var(--card-border); border-radius:8px; padding:8px; max-height:180px; overflow-y:auto; font-family:ui-monospace, monospace; font-size:10.5px; color:#94a3b8; white-space:pre-wrap; word-break:break-all;"></div>
