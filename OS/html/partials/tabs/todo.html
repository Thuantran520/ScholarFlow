<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <div class="feature-title" style="margin-bottom:0;" data-i18n="todo_title">Todo List</div>
      <span id="todo-badge-stats" style="font-size:11px; font-weight:600; color:var(--text-primary, #f1f5f9); background:rgba(255,255,255,0.06); padding:2px 8px; border-radius:12px; border:1px solid rgba(255,255,255,0.12);">0/0</span>
    </div>
    <p style="color:var(--text-muted); font-size:11.5px; margin-bottom:8px; line-height:1.4;" data-i18n="todo_desc">Ghi chú nhanh các công việc cần làm.</p>

    <!-- Progress Bar -->
    <div style="background:rgba(15,23,42,0.6); border-radius:6px; height:6px; overflow:hidden; margin-bottom:12px; border:1px solid rgba(255,255,255,0.08);">
      <div id="todo-progress-bar" style="background:rgba(255,255,255,0.85); height:100%; width:0%; transition:width 0.3s ease;"></div>
    </div>

    <!-- Add Task Card -->
    <div class="feature-card" style="padding:10px 12px; margin-bottom:12px; background:rgba(15,23,42,0.5); border:1px solid rgba(255,255,255,0.12); border-radius:10px;">
      <div style="display:flex; gap:6px; margin-bottom:8px;">
        <input type="text" id="todo-input" class="form-control" placeholder="Thêm việc mới..." data-i18n-placeholder="todo_placeholder" style="flex:1; font-size:13px; padding:7px 10px;">
        <select id="todo-priority-select" class="form-control" style="width:105px; font-size:11.5px; padding:6px 6px; cursor:pointer;">
          <option value="normal" data-i18n="todo_priority_normal">Vừa</option>
          <option value="urgent" data-i18n="todo_priority_urgent">Gấp</option>
          <option value="low" data-i18n="todo_priority_low">Thấp</option>
        </select>
        <button id="btn-todo-add" class="btn btn-primary" style="padding:7px 12px; font-size:12px; font-weight:700;" data-i18n="todo_btn_add">Thêm</button>
      </div>

      <!-- Extra detail note input -->
      <input type="text" id="todo-detail-input" class="form-control" placeholder="Ghi chú chi tiết, tài liệu hoặc link (tùy chọn)..." data-i18n-placeholder="todo_detail_placeholder" style="font-size:11.5px; padding:6px 10px; background:rgba(0,0,0,0.25); border-color:rgba(255,255,255,0.08);">
    </div>

    <!-- Filter & Toolbar Buttons -->
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px; margin-bottom:10px;">
      <div class="todo-filter-group" style="display:flex; gap:4px;">
        <button type="button" class="btn-text-small todo-filter-btn active" data-filter="all" id="filter-all" data-i18n="todo_filter_all">Tất cả</button>
        <button type="button" class="btn-text-small todo-filter-btn" data-filter="active" id="filter-active" data-i18n="todo_filter_active">Chưa xong</button>
        <button type="button" class="btn-text-small todo-filter-btn" data-filter="done" id="filter-done" data-i18n="todo_filter_done">Đã xong</button>
      </div>
      <div style="display:flex; gap:6px;">
        <button type="button" class="todo-tool-btn" id="btn-todo-copy-all" title="Sao chép toàn bộ danh sách">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
          <span data-i18n="todo_btn_copy_all">Copy</span>
        </button>
        <button type="button" class="todo-tool-btn" id="btn-todo-export" title="Xuất file văn bản">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="todo_btn_export">Xuất TXT</span>
        </button>
        <button type="button" class="todo-tool-btn todo-tool-btn-danger" id="btn-todo-clear-done" title="Dọn dẹp các mục đã hoàn thành">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          <span data-i18n="todo_btn_clear_done">Dọn việc xong</span>
        </button>
      </div>
    </div>

    <!-- Task List Container -->
    <div id="todo-list" style="display: flex; flex-direction: column; gap: 8px;">
      <!-- TODO items -->
    </div>
