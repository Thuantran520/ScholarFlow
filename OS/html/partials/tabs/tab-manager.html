                    <stop offset="75%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#ef4444" />

                    <stop offset="60%" stop-color="#38bdf8" />
                    <stop offset="100%" stop-color="#e0f2fe" />
                  </linearGradient>
                  <filter id="tabmgrNeedleGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>

                <!-- Outer Ambient Bezel Dash Track -->
                <path class="tabmgr-gauge-outer-ring" d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="2 3" />

                <!-- Background Arc -->
                <path class="tabmgr-gauge-track" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="9" stroke-linecap="round" />

                <!-- Redline Arc segment (75% to 100%) -->
                <path class="tabmgr-gauge-redline" d="M 148 50 A 72 72 0 0 1 172 100" fill="none" stroke="rgba(239, 68, 68, 0.28)" stroke-width="9" stroke-linecap="round" />

                <!-- Active Progress Arc -->
                <path id="tabmgr-gauge-bar" class="tabmgr-gauge-fill" d="M 28 100 A 72 72 0 0 1 172 100" fill="none" stroke="url(#tabmgrGaugeGrad)" stroke-width="9" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="170" />

                <!-- Radial Tachometer Scale Ticks -->
                <g class="tabmgr-gauge-ticks">
                  <!-- 0% -->
                  <line x1="38" y1="100" x2="45" y2="100" stroke="#38bdf8" stroke-width="2" />
                  <line x1="41" y1="84" x2="47" y2="86" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <line x1="47" y1="69" x2="52" y2="72" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <!-- 25% (1/4) -->
                  <line x1="56" y1="56" x2="62" y2="62" stroke="#38bdf8" stroke-width="2" />
                  <line x1="69" y1="47" x2="72" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <line x1="84" y1="41" x2="86" y2="47" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <!-- 50% (1/2) -->
                  <line x1="100" y1="38" x2="100" y2="45" stroke="#818cf8" stroke-width="2" />
                  <line x1="116" y1="41" x2="114" y2="47" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <line x1="131" y1="47" x2="128" y2="52" stroke="rgba(255,255,255,0.2)" stroke-width="1.2" />
                  <!-- 75% (3/4 Redline zone start) -->
                  <line x1="144" y1="56" x2="138" y2="62" stroke="#ef4444" stroke-width="2" />
                  <line x1="153" y1="69" x2="148" y2="72" stroke="rgba(239,68,68,0.55)" stroke-width="1.2" />
                  <line x1="159" y1="84" x2="153" y2="86" stroke="rgba(239,68,68,0.55)" stroke-width="1.2" />
                  <!-- 100% (MAX) -->
                  <line x1="162" y1="100" x2="155" y2="100" stroke="#ef4444" stroke-width="2.2" />
                </g>

                <!-- Speedometer Needle -->
                <g id="tabmgr-gauge-needle-group" class="tabmgr-gauge-needle" style="transform-origin: 100px 100px; transform: rotate(-60deg);">
                  <!-- Needle glow backing -->
                  <path d="M 98 100 L 99.3 22 L 100.7 22 L 102 100 Z" fill="#38bdf8" opacity="0.4" filter="url(#tabmgrNeedleGlow)" />
                  <!-- Needle tapered blade -->
                  <path d="M 98.4 100 L 99.5 22 L 100.5 22 L 101.6 100 Z" fill="url(#tabmgrNeedleGrad)" />
                  <!-- Needle pointer tip -->
                  <polygon points="99.2,26 100.8,26 100,16" fill="#f8fafc" filter="url(#tabmgrNeedleGlow)" />
                  <!-- Center metallic hub -->
                  <circle cx="100" cy="100" r="8.5" fill="#090d16" stroke="#38bdf8" stroke-width="1.8" />
                  <circle cx="100" cy="100" r="4.5" fill="#1e293b" stroke="rgba(255, 255, 255, 0.25)" stroke-width="0.8" />
                  <circle cx="100" cy="100" r="2" fill="#38bdf8" />
                </g>

                <!-- Tachometer Scale Marks -->
                <text x="24" y="112" class="tabmgr-gauge-tick">0</text>

                <text x="158" y="50" class="tabmgr-gauge-tick tabmgr-tick-red">3/4</text>
                <text x="176" y="112" text-anchor="end" class="tabmgr-gauge-tick tabmgr-tick-red">MAX</text>

                  <span id="tabmgr-gauge-status-text">CRUISING</span>
                </div>
              </div>

            <select id="tabmgr-gx-sleep-timeout" class="tabmgr-gx-select" title="Thời gian tự động cho tab không hoạt động vào chế độ ngủ" data-i18n-title="tabmgr_gx_timeout_tip">

              <option value="30" data-i18n="tabmgr_gx_sleep_30m">Ngủ sau 30 phút</option>
              <option value="60" data-i18n="tabmgr_gx_sleep_1h">Ngủ sau 1 giờ</option>
            </select>
          </div>

          <div class="tabmgr-gx-protect-row">
            <span class="tabmgr-gx-protect-tag" title="Không bao giờ cho tab đang phát âm thanh hoặc video vào chế độ ngủ" data-i18n-title="tabmgr_gx_protect_audio_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              <span data-i18n="tabmgr_gx_protect_audio">Bảo vệ âm thanh</span>
            </span>
            <span class="tabmgr-gx-protect-tag" title="Không bao giờ cho các tab được ghim vào chế độ ngủ" data-i18n-title="tabmgr_gx_protect_pinned_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
              <span data-i18n="tabmgr_gx_protect_pinned">Bảo vệ ghim</span>
            </span>
            <span class="tabmgr-gx-protect-tag" title="Luôn giữ tab hiện tại thức" data-i18n-title="tabmgr_gx_protect_active_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              <span data-i18n="tabmgr_gx_protect_active">Bảo vệ tab xem</span>
            </span>
