      <!-- RAM Limiter Panel (Racing Cockpit) -->
      <div class="tabmgr-gx-card" id="tabmgr-gx-card">
        <div class="tabmgr-gx-head">
          <div class="tabmgr-gx-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path><circle cx="12" cy="12" r="7"></circle><polyline points="12 9 12 12 13.5 13.5"></polyline></svg>
            <span data-i18n="tabmgr_gx_limiter_title">RAM Limiter</span>
          </div>
          <label class="tabmgr-media-switch" title="Bật/Tắt giới hạn RAM" data-i18n-title="tabmgr_gx_limiter_toggle">
            <input type="checkbox" id="tabmgr-gx-limiter-toggle" checked>
            <span class="tabmgr-media-switch-slider"></span>
          </label>
        </div>

        <div id="tabmgr-gx-body" class="tabmgr-gx-body">
          <!-- Modern Minimalist Glowing Arc Gauge (Image 2 style) -->
          <div class="tabmgr-modern-gauge-wrap">
            <div class="tabmgr-modern-gauge-dial">
              <svg class="tabmgr-modern-gauge-svg" viewBox="0 0 200 110">
                <defs>
                  <linearGradient id="tabmgrModernGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#38bdf8" />
                    <stop offset="50%" stop-color="#818cf8" />
                    <stop offset="100%" stop-color="#c084fc" />
                  </linearGradient>
                  <linearGradient id="tabmgrModernWarnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#fbbf24" />
                    <stop offset="100%" stop-color="#f59e0b" />
                  </linearGradient>
                  <linearGradient id="tabmgrModernDangerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#f43f5e" />
                    <stop offset="100%" stop-color="#ef4444" />
                  </linearGradient>
                  <filter id="tabmgrModernGlow" x="-20%" y="-20%" width="140%" height="140%">
                    <feGaussianBlur stdDeviation="3" result="blur" />
                    <feMerge>
                      <feMergeNode in="blur" />
                      <feMergeNode in="SourceGraphic" />
                    </feMerge>
                  </filter>
                </defs>

                <!-- Background Track Arc -->
                <path class="tabmgr-modern-track" d="M 28 96 A 72 72 0 0 1 172 96" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="15" stroke-linecap="round" />

                <!-- Active Progress Arc with Rich Glow -->
                <path id="tabmgr-gauge-bar" class="tabmgr-modern-fill" d="M 28 96 A 72 72 0 0 1 172 96" fill="none" stroke="url(#tabmgrModernGrad)" stroke-width="15" stroke-linecap="round" stroke-dasharray="226" stroke-dashoffset="170" filter="url(#tabmgrModernGlow)" />

                <!-- Hidden needle element for JS compatibility -->
                <g id="tabmgr-gauge-needle-group" style="display:none;"></g>
              </svg>
              <div class="tabmgr-modern-center">
                <span id="tabmgr-gx-usage-val" class="tabmgr-modern-val">0.0 / 4.0 GB</span>
                <span class="tabmgr-modern-label" data-i18n="tabmgr_gx_usage_lbl">RAM ước tính</span>
                <div id="tabmgr-gauge-status" class="tabmgr-gauge-status is-cruising">
                  <span class="tabmgr-gauge-dot"></span>
                  <span id="tabmgr-gauge-status-text">CRUISING</span>
                </div>
              </div>
            </div>
            <!-- Hidden telemetry bar for backwards compatibility -->
            <div class="tabmgr-gx-bar-bg" style="display:none;"><div id="tabmgr-gx-bar-fill" class="tabmgr-gx-bar-fill" style="width: 25%;"></div></div>
          </div>

          <!-- Capsule Pill Slider (Image 1 style) -->
          <div class="tabmgr-gx-slider-row">
            <div class="tabmgr-gx-slider-header">
              <div class="tabmgr-gx-slider-label-group">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 19v-3M10 19v-3M14 19v-3M18 19v-3M6 5v3M10 5v3M14 5v3M18 5v3M2 8h20v8H2z"></path></svg>
                <span data-i18n="tabmgr_gx_limit_setting">Mức giới hạn RAM:</span>
              </div>
            </div>

              <div class="tabmgr-capsule-track-container">

                  <div id="tabmgr-capsule-thumb" class="tabmgr-capsule-thumb" style="left: 20%; transform: translate(-20%, -50%);">
                    <strong id="tabmgr-gx-slider-val" class="tabmgr-capsule-val">4.0 GB</strong>

              </div>
              <span class="tabmgr-capsule-bound is-clickable" id="tabmgr-gx-slider-max-bound" title="Nhấn để đổi thang đo RAM tối đa (16GB, 32GB, 64GB, 128GB, 1TB)" data-i18n-title="tabmgr_gx_scale_tip">16 GB</span>

            <div class="tabmgr-gx-presets-row">

              <button type="button" class="tabmgr-gx-preset-btn" data-val="8">8 GB</button>
              <button type="button" class="tabmgr-gx-preset-btn" data-val="12">12 GB</button>
              <button type="button" class="tabmgr-gx-preset-btn" data-val="16">16 GB</button>
            </div>
          </div>

          <div class="tabmgr-gx-options-row">
            <label class="tabmgr-gx-switch-lbl" title="Khi bật, tự động ép ngủ các tab nền ngay khi RAM chạm ngưỡng giới hạn" data-i18n-title="tabmgr_gx_hard_limit_tip">
              <span class="tabmgr-gx-switch-box">
                <input type="checkbox" id="tabmgr-gx-hard-limit" class="tabmgr-gx-switch-input">
                <span class="tabmgr-gx-switch-slider"></span>
              </span>
              <span data-i18n="tabmgr_gx_hard_limit" class="tabmgr-gx-switch-text">Giới hạn cứng (Hard Limit)</span>
            </label>
            <select id="tabmgr-gx-sleep-timeout" class="tabmgr-gx-select" title="Thời gian tự động cho tab không hoạt động vào chế độ ngủ" data-i18n-title="tabmgr_gx_timeout_tip">
              <option value="0" data-i18n="tabmgr_gx_sleep_manual">Ngủ thủ công</option>
              <option value="5" data-i18n="tabmgr_gx_sleep_5m">Ngủ sau 5 phút</option>
              <option value="15" selected data-i18n="tabmgr_gx_sleep_15m">Ngủ sau 15 phút</option>
              <option value="30" data-i18n="tabmgr_gx_sleep_30m">Ngủ sau 30 phút</option>
              <option value="60" data-i18n="tabmgr_gx_sleep_1h">Ngủ sau 1 giờ</option>
            </select>
          </div>

          <div class="tabmgr-gx-protect-row">
            <span class="tabmgr-gx-protect-tag" title="Không bao giờ cho tab đang phát âm thanh hoặc video vào chế độ ngủ" data-i18n-title="tabmgr_gx_protect_audio_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
              <span data-i18n="tabmgr_gx_protect_audio">Bảo vệ âm thanh</span>
            </span>
            <span class="tabmgr-gx-protect-tag" title="Không bao giờ cho các tab được ghim vào chế độ ngủ" data-i18n-title="tabmgr_gx_protect_pinned_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="17" x2="12" y2="22"></line><path d="M5 17h14v-1.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V6h1a1 1 0 0 0 0-2H8a1 1 0 0 0 0 2h1v4.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24Z"></path></svg>
              <span data-i18n="tabmgr_gx_protect_pinned">Bảo vệ ghim</span>
            </span>
            <span class="tabmgr-gx-protect-tag" title="Luôn giữ tab hiện tại thức" data-i18n-title="tabmgr_gx_protect_active_tip">
              <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 14 14"></polyline></svg>
              <span data-i18n="tabmgr_gx_protect_active">Bảo vệ tab xem</span>
            </span>
          </div>

          <div class="tabmgr-hero-actions" style="margin-top:8px;">
            <button id="btn-tabmgr-optimize-ram" class="tabmgr-opt-btn" title="Tạm dừng toàn bộ tab không hoạt động để giải phóng bộ nhớ RAM" data-i18n-title="tabmgr_btn_optimize_ram_tip">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"></path></svg>
              <span data-i18n="tabmgr_btn_optimize_ram">Tối ưu RAM ngay</span>
            </button>
            <button id="btn-tabmgr-wake-all" class="tabmgr-sub-btn" data-i18n="tabmgr_btn_wake_all">Đánh thức tất cả</button>
            <button id="btn-tabmgr-close-dup" class="tabmgr-sub-btn" data-i18n="tabmgr_btn_close_dup">Đóng trùng</button>
            <button id="btn-tabmgr-close-blank" class="tabmgr-sub-btn" data-i18n="tabmgr_btn_close_blank">Đóng tab rỗng</button>
