<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
      <div class="feature-title" style="margin-bottom:0;" data-i18n="tabmgr_title">Tab Manager</div>
      <span id="tabmgr-count-badge" style="font-size:11px; font-weight:700; color:#38bdf8; background:rgba(56,189,248,0.12); padding:2px 8px; border-radius:12px; border:1px solid rgba(56,189,248,0.25);">0</span>
    </div>
    <p style="color:var(--text-muted); font-size:11.5px; margin-bottom:8px; line-height:1.4;" data-i18n="tabmgr_desc">Quản lý tab trên cả Firefox & Chromium — ghim, bookmark, đóng, nhân đôi.</p>
    <div id="tabmgr-active-live" style="font-size:10px; color:#38bdf8; background:rgba(56,189,248,0.08); border:1px solid rgba(56,189,248,0.15); border-radius:6px; padding:4px 8px; margin-bottom:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">--:--:--</div>
    <div style="display:flex; gap:6px; margin-bottom:8px;">
      <input type="text" id="tabmgr-search" class="form-control" placeholder="Tìm tab..." data-i18n-placeholder="tabmgr_search_ph" style="flex:1; font-size:11px; padding:5px 8px;">
      <button id="btn-tabmgr-refresh" class="cal-tool-btn" title="Làm mới" data-i18n-title="tabmgr_btn_refresh">↻</button>
    </div>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap; align-items:center;">
      <select id="tabmgr-sort" class="form-control" style="width:130px; font-size:11px; padding:5px 6px;">
        <option value="title_asc" data-i18n="tabmgr_sort_title_asc">Tên A→Z</option>
        <option value="title_desc" data-i18n="tabmgr_sort_title_desc">Tên Z→A</option>
        <option value="domain" data-i18n="tabmgr_sort_domain">Theo domain</option>
        <option value="url_asc" data-i18n="tabmgr_sort_url">Theo URL</option>
      </select>
      <select id="tabmgr-group-mode" class="form-control" style="width:130px; font-size:11px; padding:5px 6px;">
        <option value="none" data-i18n="tabmgr_group_none">Không nhóm</option>
        <option value="domain" data-i18n="tabmgr_group_domain">Nhóm domain</option>
        <option value="function" data-i18n="tabmgr_group_function">Nhóm chức năng</option>
      </select>
      <span style="margin-left:auto; font-size:10px; color:var(--text-muted);"><span id="tabmgr-domain-count">0</span> domain</span>
    </div>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
      <button id="btn-tabmgr-close-dup" class="btn-text-small" data-i18n="tabmgr_btn_close_dup">Đóng trùng</button>
      <button id="btn-tabmgr-bookmark-all" class="btn-text-small" data-i18n="tabmgr_btn_bookmark_all">Bookmark tất cả</button>
      <button id="btn-tabmgr-discard-all" class="btn-text-small" data-i18n="tabmgr_btn_discard_all">Tạm dừng</button>
      <button id="btn-tabmgr-close-all" class="btn-text-small" style="color:#94a3b8; border-color:rgba(255,255,255,0.08);" data-i18n="tabmgr_btn_close_all">Đóng tất cả</button>
    </div>
    <div style="display:flex; gap:6px; margin-bottom:8px; flex-wrap:wrap;">
      <button id="btn-tabmgr-export-md" class="btn-text-small" data-i18n="tabmgr_btn_export_md">Xuất MD</button>
      <button id="btn-tabmgr-export-txt" class="btn-text-small" data-i18n="tabmgr_btn_export_txt">Xuất TXT</button>
      <button id="btn-tabmgr-group-browser" class="btn-text-small" style="background:rgba(56,189,248,0.08); border-color:rgba(56,189,248,0.18); color:#38bdf8;" data-i18n="tabmgr_btn_group_browser">Nhóm ở trình duyệt</button>
    </div>
    <div style="background:rgba(15,23,42,0.5); border:1px solid var(--card-border); border-radius:8px; padding:8px; margin-bottom:10px;">
      <div style="font-size:11px; font-weight:700; color:var(--text-muted); margin-bottom:6px;" data-i18n="tabmgr_session_title">Phiên làm việc</div>
      <div style="display:flex; gap:6px; margin-bottom:6px;">
        <input type="text" id="tabmgr-session-name" class="form-control" placeholder="Tên phiên..." data-i18n-placeholder="tabmgr_session_ph" style="flex:1; font-size:11px; padding:5px 8px;">
        <button id="btn-tabmgr-save-session" class="btn-text-small" data-i18n="tabmgr_btn_save_session">Lưu</button>
      </div>
      <div id="tabmgr-session-list" style="display:flex; flex-direction:column; gap:6px;"></div>
    </div>
    <div id="tabmgr-list" style="display:flex; flex-direction:column; gap:8px;"></div>
