<div id="biblio-modal" class="modal-overlay">
    <div class="modal-header">
      <div class="modal-title">
        <span data-i18n="biblio_modal_title">Danh mục trích dẫn đã lưu</span>
        <span class="biblio-index-pill" id="modal-biblio-count">0</span>
      </div>
      <button class="btn btn-secondary" id="btn-close-biblio" style="padding:4px 10px; font-size:12px;" data-i18n="btn_close">✕ Đóng</button>
    </div>

    <!-- Search & Filter Bar -->
    <div style="margin-bottom:8px; display:flex; gap:6px;">
      <input type="text" id="biblio-search-input" class="form-control" placeholder="Tìm tác giả, tiêu đề, tag, năm..." data-i18n-placeholder="biblio_search_placeholder" style="flex:1; font-size:11.5px; padding:6px 10px;">
      <select id="biblio-sort-select" class="form-control" style="width:110px; font-size:11px; padding:6px 4px;">
        <option value="savedAt" data-i18n="biblio_sort_saved">Mới lưu</option>
        <option value="year" data-i18n="biblio_sort_year">Theo năm</option>
        <option value="title" data-i18n="biblio_sort_title">Theo tên</option>
        <option value="tag" data-i18n="biblio_sort_tag">Theo tag</option>
      </select>
    </div>

    <!-- Modal Style Switch Tabs -->
    <div class="sub-tabs" style="margin-bottom:8px;">
      <button class="sub-tab-btn active" id="modal-tab-ieee" data-modaltab="ieee">IEEE</button>
      <button class="sub-tab-btn" id="modal-tab-apa" data-modaltab="apa">APA 7th</button>
      <button class="sub-tab-btn" id="modal-tab-harvard" data-modaltab="harvard">Harvard</button>
      <button class="sub-tab-btn" id="modal-tab-bibtex" data-modaltab="bibtex">BibTeX</button>
      <button class="sub-tab-btn" id="modal-tab-mla" data-modaltab="mla">MLA 9th</button>
      <button class="sub-tab-btn" id="modal-tab-vancouver" data-modaltab="vancouver">Vancouver</button>
      <button class="sub-tab-btn" id="modal-tab-chicago" data-modaltab="chicago">Chicago 17</button>
      <button class="sub-tab-btn" id="modal-tab-acs" data-modaltab="acs">ACS</button>
      <button class="sub-tab-btn" id="modal-tab-ama" data-modaltab="ama">AMA 11th</button>
    </div>

    <!-- Items List Container -->
    <div id="biblio-items" style="margin-bottom:8px; flex:1; min-height:80px; overflow-y:auto;">
      <!-- Dynamic cards rendered safely via document.createElement -->
    </div>

    <!-- Modal Action Buttons Row -->
    <div class="biblio-modal-actions" style="margin-top:auto; padding-top:8px; border-top:1px solid var(--card-border);">
      <!-- Row 1: Primary Action (Copy All) -->
      <button class="btn btn-primary biblio-action-btn-primary" id="btn-copy-all-biblio" title="Sao chép toàn bộ danh mục tài liệu theo định dạng đang chọn" data-i18n-title="tip_copy_all">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
        <span data-i18n="btn_copy_all_biblio">Sao chép tất cả</span>
      </button>

      <!-- Row 2: Export Formats (.bib, .ris, .txt) -->
      <div class="biblio-export-row">
        <button class="btn btn-secondary biblio-export-btn" id="btn-export-bib-all" title="Tải file references.bib cho LaTeX/Overleaf" data-i18n-title="tip_download_bib2">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 18 22 12 16 6"></polyline><polyline points="8 6 2 12 8 18"></polyline></svg>
          <span data-i18n="btn_export_bib_all">Xuất .bib</span>
        </button>
        <button class="btn btn-secondary biblio-export-btn" id="btn-export-ris-all" title="Tải file .ris cho Zotero/EndNote" data-i18n-title="tip_export_ris">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="btn_export_ris">Xuất .ris</span>
        </button>
        <button class="btn btn-secondary biblio-export-btn" id="btn-export-txt-all" title="Tải file references.txt cho Word" data-i18n-title="tip_export_txt">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
          <span data-i18n="btn_export_txt_all">Xuất .txt</span>
        </button>
        <button class="btn btn-secondary biblio-export-btn" id="btn-export-xml-all" title="Tải file references.xml cho EndNote/Reference Manager" data-i18n-title="tip_export_xml">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="btn_export_xml_all">Xuất .xml</span>
        </button>
        <button class="btn btn-secondary biblio-export-btn" id="btn-export-json-all" title="Tải file references.json chuẩn CSL-JSON cho Zotero/Mendeley" data-i18n-title="tip_export_json">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
          <span data-i18n="btn_export_json_all">Xuất .json</span>
        </button>
      </div>

      <!-- Row 3: Destructive Action (Clear All) -->
      <button class="btn biblio-clear-btn" id="btn-clear-all-biblio" title="Xóa sạch toàn bộ danh mục trích dẫn đã lưu" data-i18n-title="tip_clear_all_biblio">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
        <span data-i18n="btn_clear_all_biblio">Xóa toàn bộ danh mục đã lưu</span>
      </button>
    </div>
  </div>
