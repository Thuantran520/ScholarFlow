<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Panadolce - Teleprompter</title>
  <link rel="stylesheet" href="../css/fonts.css">
  <link rel="stylesheet" href="../css/popup.css">
  <style>
    :root {
      --prompter-font: 22px;
      --prompter-speed: 1;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Open Sans", "Helvetica Neue", sans-serif;
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
      overflow: hidden;
    }
    #prompter-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      background: rgba(30, 41, 59, 0.9);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      font-size: 11px;
      flex-wrap: wrap;
    }
    #prompter-toolbar button {
      background: rgba(56, 189, 248, 0.15);
      color: #e0f2fe;
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 5px;
      padding: 4px 9px;
      font-size: 11px;
      cursor: pointer;
      white-space: nowrap;
    }
    #prompter-toolbar button:hover { background: rgba(56, 189, 248, 0.3); }
    #prompter-toolbar button.primary { background: #0ea5e9; color: #082f49; font-weight: 700; }
    #prompter-toolbar .ctl { display: flex; align-items: center; gap: 4px; }
    #prompter-toolbar .ctl label { color: #94a3b8; }
    #prompter-toolbar input[type="range"] { width: 74px; accent-color: #0ea5e9; }
    #prompter-toolbar .val { color: #38bdf8; min-width: 34px; text-align: right; }
    #prompter-stage {
      flex: 1 1 auto;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px 20px 40px;
      box-sizing: border-box;
      background: linear-gradient(180deg, #0b1220 0%, #0f1e35 100%);
      scrollbar-width: thin;
      scrollbar-color: #334155 transparent;
    }
    .prompter-para {
      white-space: pre-wrap;
      font-size: var(--prompter-font);
      line-height: 1.55;
      margin: 0 0 18px;
      color: #cbd5e1;
      opacity: 0.55;
      padding: 2px 10px;
      border-left: 3px solid transparent;
      border-radius: 4px;
      transition: opacity 0.2s, background 0.2s;
    }
    .prompter-para.active {
      opacity: 1;
      color: #f8fafc;
      background: rgba(14, 165, 233, 0.12);
      border-left-color: #0ea5e9;
    }
    #prompter-now {
      padding: 6px 12px;
      font-size: 12.5px;
      color: #7dd3fc;
      background: rgba(15, 30, 53, 0.95);
      border-top: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      flex: none;
      min-height: 26px;
      box-sizing: border-box;
    }
    #prompter-notes {
      display: none;
      flex: 0 1 42%;
      overflow-y: auto;
      background: rgba(15, 30, 53, 0.95);
      border-top: 1px solid rgba(148, 163, 184, 0.2);
      padding: 6px 8px;
    }
    #prompter-notes.open { display: block; }
    #prompter-notes-title {
      font-size: 10.5px;
      font-weight: 700;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 5px;
    }
    .prompter-note {
      font-size: 12px;
      line-height: 1.4;
      color: #64748b;
      padding: 4px 8px;
      border-radius: 4px;
      margin-bottom: 3px;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .prompter-note.active { color: #f8fafc; background: rgba(14, 165, 233, 0.2); }
    #prompter-empty {
      color: #64748b;
      padding: 30px 10px;
      text-align: center;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="prompter-toolbar">
    <button id="prompter-toggle" class="primary" data-i18n="prompter_play">Phát</button>
    <button id="prompter-reset" data-i18n="prompter_reset">Về đầu</button>
    <div class="ctl">
      <label data-i18n="prompter_speed">Tốc độ</label>
      <input type="range" id="prompter-speed" min="0.3" max="3" step="0.1" value="1" title="0.3x - 3x" aria-label="Speed">
      <span id="prompter-speed-val" class="val">1.0x</span>
    </div>
    <div class="ctl">
      <label data-i18n="prompter_font">Cỡ chữ</label>
      <input type="range" id="prompter-font" min="12" max="44" step="1" value="22" aria-label="Font size">
      <span id="prompter-font-val" class="val">22</span>
    </div>
    <button id="prompter-notes-toggle" data-i18n="prompter_notes">Ghi chú</button>
  </div>

  <div id="prompter-stage">
    <div id="prompter-track">
      <div id="prompter-loading" data-i18n="script_prompter_loading">Đang tải kịch bản...</div>
    </div>
  </div>

  <div id="prompter-now"></div>

  <div id="prompter-notes">
    <div id="prompter-notes-title" data-i18n="prompter_notes">Ghi chú</div>
    <div id="prompter-notes-list"></div>
  </div>

  <script src="../locales/vi.js"></script>
  <script src="../locales/en.js"></script>
  <script src="../locales/zh.js"></script>
  <script src="../locales/ru.js"></script>
  <script src="../locales/ja.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/prompter.js"></script>
</body>
</html>
