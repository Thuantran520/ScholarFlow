<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="gbl_title">Panadolce — Trang cờ bạc đã bị chặn</title>
  <link rel="icon" type="image/png" href="../../icon.svg">
  <link rel="stylesheet" href="../css/gamble-block.css">
</head>
<body>
  <main class="gbl-card" role="main">
    <div class="gbl-shield" aria-hidden="true">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><line x1="8.5" y1="12" x2="15.5" y2="12"></line></svg>
    </div>
    <h1 data-i18n="gbl_heading">Trang cờ bạc đã bị chặn</h1>
    <p class="gbl-msg" id="gbl-msg"></p>
    <p class="gbl-tip" data-i18n="gbl_tip">Nếu bạn bấm vào link từ bình luận mạng xã hội — đây thường là chiêu lừa "tài xỉu 100% thắng" hoặc "kèo sạch". Không nhà cái nào cho tiền người chơi cả.</p>
    <div class="gbl-actions">
      <button type="button" class="gbl-btn gbl-btn-primary" id="btn-gbl-back" data-i18n="gbl_back">← Quay lại trang trước</button>
      <button type="button" class="gbl-btn gbl-btn-ghost" id="btn-gbl-allow" data-i18n="gbl_allow">Bỏ chặn tên miền này</button>
    </div>
    <p class="gbl-foot" data-i18n="gbl_off_hint">Có thể bật/tắt lá chắn này trong Panadolce → Social → Bảo vệ.</p>
  </main>
  <script src="../locales/vi.js"></script>
  <script src="../locales/en.js"></script>
  <script src="../locales/zh.js"></script>
  <script src="../locales/ru.js"></script>
  <script src="../locales/ja.js"></script>
  <script src="../js/i18n.js"></script>
  <script src="../js/gamble-block.js"></script>
</body>
</html>
