name: Build, Check & Package ScholarFlow

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

concurrency:
  group: scholarflow-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: GitLeaks secret scan (whole repo)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks (community edition, no token/license needed)
        shell: bash
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks
          gitleaks detect --source . --no-banner --exit-code 1

  build:
    name: Check + build per-branch dist zips
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js (for JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install test dependencies
        run: npm ci

      - name: npm audit (vulnerability gate)
        run: npm audit --audit-level=high

      - name: Run test scripts (jsdom smoke tests + i18n integration)
        run: npm test

      - name: Normalize branch label (artifact + zip naming)
        id: branch
        shell: pwsh
        run: |
          $raw = "${{ github.head_ref || github.ref_name }}"
          $safe = ($raw -replace '[\\/:*?"<>|]', '-').Trim()
          if (-not $safe) { $safe = "unknown" }
          "branch_label=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "branch_label=$safe"

      - name: Run pre-packaging checks + build packages
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package.ps1 -Branch "${{ steps.branch.outputs.branch_label }}"

      - name: Upload per-branch packages
        uses: actions/upload-artifact@v4
        with:
          name: scholarflow-${{ steps.branch.outputs.branch_label }}
          path: |
            dist/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, gitleaks]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Normalize tag label (same naming used by the build job)
        id: tag
        shell: bash
        run: echo "artifact_name=scholarflow-$(echo '${{ github.ref_name }}' | sed 's/[\\\/:*?"<>|]/-/g')" >> "$GITHUB_OUTPUT"

      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.tag.outputs.artifact_name }}

      - name: Create/update GitHub Release with zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          fail_on_unmatched_files: true