name: Build, Check & Package ScholarFlow

on:
  push:
    branches: [main, "2.4.1"]
    tags: ["v*"]
  pull_request:
    branches: [main, "2.4.1"]
  workflow_dispatch:

jobs:
  build:
    name: Check + build dist zips
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js (for JS syntax check)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run pre-packaging checks + build packages
        shell: pwsh
        run: pwsh -NoProfile -ExecutionPolicy Bypass -File ./scripts/package.ps1

      - name: Upload Firefox & Chrome packages
        uses: actions/upload-artifact@v4
        with:
          name: scholarflow-dist
          path: |
            dist/*.zip
          if-no-files-found: error

  release:
    name: Attach packages to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          name: scholarflow-dist

      - name: Create/update GitHub Release with zips
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.zip
          fail_on_unmatched_files: true